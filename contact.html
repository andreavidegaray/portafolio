                width: fit-content;

            }
            fieldset{

            }
            label{
                display: inline-block;
                vertical-align: top;

                color: #707070;

            input,textarea{
                width: 250px;
                border: 1px solid #bbbbbb;
                border-radius: 4px;
                margin-bottom: 3px;
            }

            .submit-btn{
                padding: 5px;
                width: fit-content;
                font-size: 13px;
                color:black;
                background-color: #eeeeee;
            }

    <body>
        <header>
            <div class="profile">
                <div class="profile-img">
                    <img src="images/avlogo2.png">
                </div>

                <div class="profile-info">

            <ul class="nav-bar">

        </header>

        <div>
            <form name= "contactMe" onsubmit= "sendMessage();"> 
                <fieldset>
                    <legend>Contact Me</legend>
                    <label>Name:</label>
                    <input name="uname" type="text"><br>

                    <label>Phone:</label>
                    <input name="phone" type="tel"><br>

                    <label>Message:</label>
                    <textarea name="message" rows="5" cols="50"></textarea><br>

                    <input class= "submit-btn" type="submit" value=" Send Email!">
                </fieldset>
            </form>
